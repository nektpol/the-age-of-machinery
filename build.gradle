
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('src/generated/**/.cache')
}

repositories {
    maven {
        url = 'https://maven.createmod.net'
    }

    maven {
        url = 'https://maven.ithundxr.dev/snapshots'
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// -----------------------------------------------------------------------------
// Create+ Development Environment
// -----------------------------------------------------------------------------

def createPlusProfilePath = providers.gradleProperty('createPlusProfile').orNull
def createPlusProfileDirectory = createPlusProfilePath == null || createPlusProfilePath.isBlank() ? null : file(createPlusProfilePath)
def createPlusRunDirectory = file('run-createplus')
def createPlusModsDirectory = new File(createPlusRunDirectory, 'mods')
def connectorCleanMinecraft = layout.buildDirectory.file('moddev/artifacts/minecraft-clean.jar')

def createPlusAssetDirectories = [
    'config',
    'defaultconfigs',
    'kubejs',
    'resourcepacks',
    'shaderpacks',
    'global_packs',
    'openloader',
    'paxi',
    'scripts'
]

// Keep the development mods folder synchronized with the Modrinth profile.
// The Age of Machinery itself is loaded from Gradle's source set.
tasks.register('syncCreatePlusMods', Sync) {
    if (createPlusProfileDirectory != null) {
        from(new File(createPlusProfileDirectory, 'mods')) {
            include '*.jar'

            exclude { details ->
                String fileName = details.file.name.toLowerCase(java.util.Locale.ROOT)
                return fileName.startsWith('theageofmachinery-') || fileName.startsWith('the-age-of-machinery-')
            }
        }
    }

    into createPlusModsDirectory

    doFirst {
        if (createPlusProfileDirectory == null) {
            throw new GradleException('Missing createPlusProfile. Set it in your user Gradle properties.')
        }

        File sourceModsDirectory = new File(createPlusProfileDirectory, 'mods')

        if (!sourceModsDirectory.isDirectory()) {
            throw new GradleException("Create+ mods directory not found: ${sourceModsDirectory}")
        }
    }
}

// Copy supporting modpack files without copying user saves, logs or options.
// This deliberately does not synchronize the entire game directory.
tasks.register('copyCreatePlusAssets', Copy) {
    if (createPlusProfileDirectory != null) {
        createPlusAssetDirectories.each { directory ->
            from(new File(createPlusProfileDirectory, directory)) {
                into directory
            }
        }
    }

    into createPlusRunDirectory
}

tasks.register('prepareCreatePlusRuntime') {
    dependsOn 'syncCreatePlusMods', 'copyCreatePlusAssets'
}

// -----------------------------------------------------------------------------
// NeoForge
// -----------------------------------------------------------------------------

neoForge {
    version = project.neo_version
    // Connector needs unpatched, Mojang-mapped Minecraft classes in development.
    additionalMinecraftArtifacts.put('vanillaDeobfuscated', connectorCleanMinecraft.get().asFile)

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            gameDirectory = createPlusRunDirectory
            systemProperty 'connector.clean.path', connectorCleanMinecraft.get().asFile.absolutePath

            // Full modpacks need more memory than a minimal development client.
            jvmArguments = ['-Xmx6G']

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()

            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// -----------------------------------------------------------------------------
// Dependencies
// -----------------------------------------------------------------------------

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create is needed to compile our Java sources.
    // The actual Create mod is loaded from the copied Create+ profile.
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }

    // Ponder API for Create integration.
    // Runtime Ponder is provided by the modpack.
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")

    // Flywheel API is required at compile time.
    // Runtime Flywheel is provided by the modpack.
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")

    // Registrate is provided at runtime by the modpack.
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
}

// -----------------------------------------------------------------------------
// Generated Mod Metadata
// -----------------------------------------------------------------------------

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        neo_version             : neo_version,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version
    ]

    inputs.properties replaceProperties

    expand replaceProperties

    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

// -----------------------------------------------------------------------------
// Run Tasks
// -----------------------------------------------------------------------------

tasks.named('runClient') {
    dependsOn tasks.named('prepareCreatePlusRuntime')
}

// -----------------------------------------------------------------------------
// Publishing
// -----------------------------------------------------------------------------

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// -----------------------------------------------------------------------------
// Java Compilation
// -----------------------------------------------------------------------------

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    processingRegression {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    campaignRegression {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

tasks.register('processingRegression', JavaExec) {
    dependsOn tasks.named('processingRegressionClasses')
    classpath = sourceSets.processingRegression.runtimeClasspath
    mainClass = 'com.TheAgeOfMachinery.create.ProcessingOperationLedgerRegression'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('check') {
    dependsOn tasks.named('processingRegression')
    dependsOn tasks.named('campaignRegression')
}

tasks.register('campaignRegression', JavaExec) {
    dependsOn tasks.named('campaignRegressionClasses')
    classpath = sourceSets.campaignRegression.runtimeClasspath
    mainClass = 'com.TheAgeOfMachinery.json.CreateChapterRegression'
    args layout.projectDirectory.asFile.absolutePath
    workingDir layout.buildDirectory.dir('campaignRegressionRun')
    doFirst {
        workingDir.mkdirs()
    }
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// -----------------------------------------------------------------------------
// IDE Configuration
// -----------------------------------------------------------------------------

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
